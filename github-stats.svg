<svg xmlns="http://www.w3.org/2000/svg" width="480" height="150" viewBox="0 0 480 150">
    <style>
        .header { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #00d4ff; }
        .stat { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #e6edf3; }
        .label { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #8b949e; }
        .bg { fill: #0a0e27; stroke: #00d4ff; stroke-width: 1.5; rx: 12; }
    </style>
    <rect width="100%" height="100%" class="bg"/>
    <text x="24" y="32" class="header">⚡ Tummala Surya — GitHub Activity</text>
    <g transform="translate(24, 55)">
        <text x="0" y="0" class="label">Public Repositories</text>
        <text x="0" y="20" class="stat">52+</text>
        
        <text x="140" y="0" class="label">Primary Focus</text>
        <text x="140" y="20" class="stat">Flutter &amp; AI Systems</text>
        
        <text x="300" y="0" class="label">Location</text>
        <text x="300" y="20" class="stat">Vijayawada, India 🇮🇳</text>
        
        <text x="0" y="55" class="label">Status</text>
        <text x="0" y="70" class="stat">🚀 Building AquaVerse AI</text>
    </g>
</svg>
